name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install pinned dependencies (numpy, matplotlib, swmm-toolkit, pytest)"
        run: python -m pip install -r requirements.txt

      - name: "Run tests: offline, includes EPA SWMM 5.2 runs (design, tide and pump checks)"
        run: python -m pytest
